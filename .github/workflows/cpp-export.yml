name: C++ export
on:
  push:
    branches: [main, feat/cpp-export]
  pull_request:
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libarchive-dev libjpeg-dev libpng-dev libtiff-dev
      - uses: actions/cache@v4
        id: opencv
        with:
          path: /home/runner/opencv-install
          key: opencv-4.13.0-ubuntu24-core-imgproc-imgcodecs-features2d-v1
      - if: steps.opencv.outputs.cache-hit != 'true'
        run: |
          curl -fL https://github.com/opencv/opencv/archive/refs/tags/4.13.0.tar.gz -o /tmp/opencv.tar.gz
          tar -xzf /tmp/opencv.tar.gz -C /tmp
          cmake -S /tmp/opencv-4.13.0 -B /tmp/opencv-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/opencv-install -DBUILD_LIST=core,imgproc,imgcodecs,features2d -DOPENCV_GENERATE_PKGCONFIG=ON -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_python3=OFF -DWITH_IPP=OFF -DWITH_OPENCL=OFF
          cmake --build /tmp/opencv-build -j2
          cmake --install /tmp/opencv-build
      - run: uv sync --project backend --group dev && uv pip install --python backend/.venv/bin/python opencv-python-headless==4.13.0.92
      - run: backend/.venv/bin/python scripts/verify-cpp-export-scope.py
      - run: .venv/bin/python -m pytest tests/test_codegen_cpp.py tests/test_codegen_cpp_native.py --basetemp=/tmp/cpp-results
        working-directory: backend
        env:
          PKG_CONFIG_PATH: /home/runner/opencv-install/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/opencv-install/lib
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: native-results, path: /tmp/cpp-results }
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: uv sync --project backend --group dev
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run build && npm run test:e2e
        working-directory: frontend
